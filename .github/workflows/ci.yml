name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentaflow
          POSTGRES_PASSWORD: dentaflow_secret
          POSTGRES_DB: dentaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter api lint

      - name: Lint Web
        run: pnpm --filter web lint

      - name: Build shared
        run: pnpm --filter @dentaflow/shared build || true

      - name: Test API
        run: pnpm --filter api test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: dentaflow
          DB_PASS: dentaflow_secret
          DB_NAME: dentaflow_test
          JWT_SECRET: test_secret_key
          JWT_REFRESH_SECRET: test_refresh_key

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build
