# Blueprint Render — https://render.com/docs/blueprint-spec

databases:
  - name: dentaflow-db
    plan: free
    databaseName: dentaflow
    user: dentaflow

services:
  - type: web
    name: dentaflow-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: |
      npm install -g pnpm@9.15.0
      NODE_ENV=development pnpm install --frozen-lockfile
      pnpm --filter @dentaflow/shared build
      pnpm --filter api build
    startCommand: NODE_ENV=production node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DATABASE_URL
        fromDatabase:
          name: dentaflow-db
          property: connectionString
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://TU-FRONT.vercel.app
      - key: CLINIC_NAME
        value: Mi Consultorio Odontológico
      - key: APP_URL
        value: https://TU-FRONT.vercel.app
